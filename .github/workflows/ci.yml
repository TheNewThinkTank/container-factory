name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate metadata
        run: |
          for image in images/*; do
            if [ -f "$image/metadata.yaml" ]; then
              echo "========================================"
              echo "Validating: $image/metadata.yaml"
              echo "========================================"
              python3 scripts/validate-metadata.py "$image/metadata.yaml"
            fi
          done

      - name: Set up security-policy Python
        run: |
          python3 -m venv .venv-security
          .venv-security/bin/pip install -r requirements-dev.txt

      - name: Validate security policy
        env:
          PYTHONPATH: src
        run: |
          .venv-security/bin/python -c \
            "from pathlib import Path; \
             from container_factory.security.policy import load_policy; \
             load_policy(Path('.config/security-policy.yaml')); \
             print('Security policy is valid.')"

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: |
          .venv-security/bin/python -m unittest discover -s tests -v

      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

  build-and-scan:
    name: Build and scan ${{ matrix.image }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        image:
          - hello
          - python
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container.yml
    with:
      image: ${{ matrix.image }}
      publish: false
