name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate metadata
        run: python3 scripts/validate-metadata.py

  build-and-scan:
    name: Build and scan images
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - hello
          - python

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read image policy
        id: metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("images/${{ matrix.image }}/metadata.yaml")
          text = path.read_text()

          match = re.search(r"(?ms)^scan:\s*\n\s+max_cvss:\s*[\"']?([^\"'\n]+)", text)
          if not match:
              raise SystemExit(f"Missing scan.max_cvss in {path}")

          print(f"max_cvss={match.group(1).strip()}")
          # GitHub Actions output
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"max_cvss={match.group(1).strip()}\n")
          PY

      - name: Build image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "container-factory/${{ matrix.image }}:ci" \
            --load \
            "images/${{ matrix.image }}"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: |
          mkdir -p sbom
          syft "container-factory/${{ matrix.image }}:ci" \
            -o cyclonedx-json="sbom/${{ matrix.image }}.cdx.json"

      - name: Install Grype
        uses: anchore/grype-action@v0

      - name: Scan image
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ci
          MAX_CVSS: ${{ steps.metadata.outputs.max_cvss }}
        run: scripts/scan-image.sh

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.image }}
          path: sbom/
