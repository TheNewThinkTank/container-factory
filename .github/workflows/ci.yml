name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate metadata
        run: python3 scripts/validate-metadata.py

      - name: Validate security policy
        run: |
          python3 -m venv .venv-security
          .venv-security/bin/pip install -r requirements-dev.txt
          PYTHONPATH=src .venv-security/bin/python -c             "from container_factory.security.policy import load_policy; load_policy(__import__('pathlib').Path('.config/security-policy.yaml')); print('Security policy is valid.')"

      - name: Unit tests
        run: |
          python3 -m venv .venv-security
          .venv-security/bin/pip install -r requirements-dev.txt
          PYTHONPATH=src .venv-security/bin/python -m unittest discover -s tests -v

  build-and-scan:
    name: Build and scan images
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - hello
          - python

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up security-policy Python
        run: |
          python3 -m venv .venv-security
          .venv-security/bin/pip install -r requirements-dev.txt

      - name: Build image
        run: |
          docker buildx build             --platform linux/amd64             --tag "container-factory/${{ matrix.image }}:ci"             --load             "images/${{ matrix.image }}"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: |
          mkdir -p sbom
          syft "container-factory/${{ matrix.image }}:ci"             -o cyclonedx-json="sbom/${{ matrix.image }}.cdx.json"

      - name: Install Grype
        uses: anchore/scan-action/download-grype@v7

      - name: Scan image
        env:
          SECURITY_PYTHON: .venv-security/bin/python
        run: scripts/scan-image.sh "${{ matrix.image }}" ci

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-${{ matrix.image }}-${{ github.sha }}
          path: |
            sbom/
            reports/
