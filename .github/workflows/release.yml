name: Release container images

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - ".config/security-policy.yaml"
      - "requirements-dev.txt"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      image:
        description: Image to release, or "all"
        required: true
        default: all
        type: choice
        options:
          - all
          - hello
          - python

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build, scan and publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - hello
          - python

    steps:
      - uses: actions/checkout@v7

      - name: Validate metadata
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        run: |
          python3 scripts/validate-metadata.py \
            "images/${{ matrix.image }}/metadata.yaml"

      - name: Set up Docker Buildx
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        uses: docker/setup-buildx-action@v4

      - name: Set up security-policy Python
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        run: |
          python3 -m venv .venv-security
          .venv-security/bin/pip install -r requirements-dev.txt

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for security checks
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "container-factory/${{ matrix.image }}:release" \
            --load "images/${{ matrix.image }}"

      - name: Install Syft
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        run: |
          mkdir -p sbom
          syft "container-factory/${{ matrix.image }}:release" \
            -o cyclonedx-json="sbom/${{ matrix.image }}.cdx.json"

      - name: Install Grype
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        id: grype
        uses: anchore/scan-action/download-grype@v7

      - name: Prepare Grype database
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: scripts/prepare-grype.sh

      - name: Security gate
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        env:
          SECURITY_PYTHON: .venv-security/bin/python
          GRYPE: ${{ steps.grype.outputs.cmd }}
          GRYPE_DB_MAX_ALLOWED_BUILT_AGE: "48h"
        run: |
          scripts/scan-image.sh \
            "${{ matrix.image }}" \
            release

      - name: Read metadata
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        id: metadata
        run: |
          python3 scripts/validate-metadata.py \
            "images/${{ matrix.image }}/metadata.yaml"

      - name: Build and push multi-arch image
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        env:
          IMAGE_NAME: ${{ steps.metadata.outputs.name }}
          VERSION: ${{ steps.metadata.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/${IMAGE_NAME}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --push "images/${{ matrix.image }}"

      - name: Upload security reports
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image)
        uses: actions/upload-artifact@v7
        with:
          name: security-${{ matrix.image }}-${{ github.sha }}
          path: |
            sbom/
            reports/
          if-no-files-found: warn
