name: Release container images

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - ".config/security-policy.yaml"
      - "requirements-dev.txt"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/reusable-container.yml"
  workflow_dispatch:
    inputs:
      image:
        description: Image to release, or "all"
        required: true
        default: all
        type: choice
        options:
          - all
          - hello
          - python

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image)
    name: Release ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - hello
          - python
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-container.yml
    with:
      image: ${{ matrix.image }}
      publish: true
