name: Release container images

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - ".config/security-policy.yaml"
      - "requirements-dev.txt"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/reusable-container.yml"
permissions:
  contents: read

jobs:
  release:
    name: Release ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - hello
          - python
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-container.yml
    with:
      image: ${{ matrix.image }}
      publish: true
