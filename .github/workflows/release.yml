name: Release container images

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - ".config/security-policy.yaml"
      - "requirements-dev.txt"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      image:
        description: Image to release, or "all"
        required: true
        default: all
        type: choice
        options:
          - all
          - hello
          - python

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Build, attest, scan and sign
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - hello
          - python

    steps:
      - uses: actions/checkout@v7

      - name: Validate metadata
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        run: python3 scripts/validate-metadata.py "images/${{ matrix.image }}/metadata.yaml"

      - name: Set up Docker Buildx
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        uses: docker/setup-buildx-action@v4

      - name: Set up security-policy Python
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        run: |
          python3 -m venv .venv-security
          .venv-security/bin/pip install -r requirements-dev.txt

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read image metadata
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        id: image_metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          import os

          path = Path("images/${{ matrix.image }}/metadata.yaml")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"name={data['name']}\n")
              f.write(f"version={data['version']}\n")
          PY

      - name: Set release tags
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ steps.image_metadata.outputs.version }}
        run: |
          VERSION="${VERSION#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          IMAGE="${IMAGE,,}"
          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "major=${MAJOR}"
            echo "minor=${MAJOR}.${MINOR}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Syft
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        uses: anchore/sbom-action/download-syft@v0

      - name: Install Grype
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        id: grype
        uses: anchore/scan-action/download-grype@v7

      - name: Prepare Grype database
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: scripts/prepare-grype.sh

      - name: Build, push and attest multi-arch image
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.major }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.minor }}
            ${{ steps.tags.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Validate published image index
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: scripts/assert-image-index.sh "${IMAGE}@${DIGEST}"

      - name: Show immutable image identity
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image: ${IMAGE}"
          echo "Digest: ${DIGEST}"
          echo "Immutable reference: ${IMAGE}@${DIGEST}"

      - name: Security gate on published digest
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        env:
          SECURITY_PYTHON: .venv-security/bin/python
          GRYPE: ${{ steps.grype.outputs.cmd }}
          GRYPE_DB_MAX_ALLOWED_BUILT_AGE: "48h"
        run: |
          scripts/scan-multiarch-image.sh \
            "${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Install Cosign
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign immutable image digest
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: scripts/sign-image.sh "${IMAGE}@${DIGEST}"

      - name: Verify signature
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        env:
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: scripts/verify-image.sh "${IMAGE}@${DIGEST}"

      - name: Verify SBOM and provenance attestations
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        env:
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: scripts/verify-attestations.sh "${IMAGE}@${DIGEST}"

      - name: Upload security reports
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image)
        uses: actions/upload-artifact@v7
        with:
          name: security-${{ matrix.image }}-${{ github.sha }}
          path: |
            sbom/
            reports/
          if-no-files-found: warn
