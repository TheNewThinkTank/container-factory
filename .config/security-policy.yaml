# Global security policy for container-factory.
version: 1

security:
  # Critical and high findings are security-gate candidates.
  fail_severity:
    - critical
    - high

  # A high finding must meet this CVSS threshold to be a gate failure.
  high_cvss_threshold: 7.0

  # For critical/high findings with no known fix:
  #   review = report but do not fail
  #   fail   = fail closed
  no_fix_action: review

  # Never fail on these severities.
  ignore_severity:
    - medium
    - low
    - negligible
    - unknown

  # Explicit, time-limited exceptions scoped to a specific image.
  # Every exception requires a reason and expiry date.
  images:
    python:
      vulnerability_exceptions:
        - id: CVE-2026-15308
          reason: >
            CVE affects CPython html.parser.HTMLParser.
            The published runtime image does not itself process
            attacker-controlled HTML. Downstream applications
            remain responsible for assessing exposure.
          expires: 2026-09-30
